name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

# One deploy at a time: overlapping runs collide on the same Cloud Functions
# ("Failed to update function"). New pushes wait for the running deploy.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting:website --project you-alignment-mindset-and-soul
